<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#grad)"/>

  <!-- Stylized "E" made of 3 horizontal bars + vertical -->
  <g transform="translate(130, 120)">
    <!-- Vertical bar -->
    <rect x="0" y="0" width="36" height="272" rx="18" fill="white"/>
    <!-- Top bar -->
    <rect x="18" y="0" width="200" height="36" rx="18" fill="white"/>
    <!-- Middle bar with arrow (commerce/forward motion) -->
    <rect x="18" y="118" width="170" height="36" rx="18" fill="white" opacity="0.85"/>
    <!-- Bottom bar -->
    <rect x="18" y="236" width="200" height="36" rx="18" fill="white"/>

    <!-- Small dot accent (like a cursor/digital element) -->
    <circle cx="228" cy="136" r="14" fill="#A5B4FC" opacity="0.9"/>
  </g>
</svg>
