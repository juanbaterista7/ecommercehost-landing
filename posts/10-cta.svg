  <text x="540" y="670" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.5">En 7 días tu tienda puede estar</text>
  <text x="540" y="710" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.5">recibiendo pedidos</text>

