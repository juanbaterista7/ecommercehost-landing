    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg10)"/>

  <!-- Decorative elements -->
  <circle cx="150" cy="200" r="200" fill="#4F46E5" opacity="0.06"/>
  <circle cx="900" cy="850" r="250" fill="#7C3AED" opacity="0.06"/>

  <!-- Emoji rocket -->
  <text x="540" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="120">&#x1F680;</text>

  <!-- Main text -->
  <text x="540" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="white">¿LISTA PARA</text>
  <text x="540" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="white">VENDER</text>
  <text x="540" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="#818CF8">ONLINE?</text>

