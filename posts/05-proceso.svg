<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg5)"/>

  <!-- Title -->
  <text x="540" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="white">ASÍ DE FÁCIL</text>
  <text x="540" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#818CF8">ES EMPEZAR</text>

  <!-- Step 1 -->
  <circle cx="200" cy="370" r="50" fill="#4F46E5"/>
  <text x="200" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="white">1</text>
  <text x="310" y="360" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="white">Nos contactas</text>
  <text x="310" y="400" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="white" opacity="0.5">Por WhatsApp, sin formularios</text>

  <!-- Line -->
  <line x1="200" y1="430" x2="200" y2="500" stroke="#4F46E5" stroke-width="3" opacity="0.4"/>

  <!-- Step 2 -->
  <circle cx="200" cy="560" r="50" fill="#4F46E5"/>
  <text x="200" y="575" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="white">2</text>
  <text x="310" y="550" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="white">Montamos tu tienda</text>
  <text x="310" y="590" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="white" opacity="0.5">En 7 días hábiles, lista para vender</text>

  <!-- Line -->
  <line x1="200" y1="620" x2="200" y2="690" stroke="#4F46E5" stroke-width="3" opacity="0.4"/>

  <!-- Step 3 -->
  <circle cx="200" cy="750" r="50" fill="#34D399"/>
  <text x="200" y="765" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="white">3</text>
  <text x="310" y="740" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="white">Empiezas a vender</text>
  <text x="310" y="780" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="white" opacity="0.5">Nosotros nos encargamos del resto</text>

  <!-- CTA -->
  <rect x="250" y="880" width="580" height="80" rx="40" fill="#4F46E5"/>
  <text x="540" y="930" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="white">Escríbenos hoy</text>

  <!-- Bottom brand -->
  <text x="540" y="1040" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.3" letter-spacing="6">E-COMMERCEHOST</text>
</svg>
