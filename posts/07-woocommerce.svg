<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg7)"/>

  <!-- Title -->
  <text x="540" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" fill="white" opacity="0.5">¿POR QUÉ</text>
  <text x="540" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#A855F7">WOOCOMMERCE</text>
  <text x="540" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" fill="white" opacity="0.5">Y NO SHOPIFY?</text>

  <!-- Comparison cards -->
  <!-- WooCommerce advantages -->
  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="880" height="90" rx="16" fill="white" opacity="0.06"/>
    <circle cx="50" cy="45" r="16" fill="#34D399"/>
    <text x="45" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="white">$</text>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white">Sin comisión por venta</text>
    <text x="85" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="white" opacity="0.4">Shopify cobra 2% en el plan básico</text>
  </g>

  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="880" height="90" rx="16" fill="white" opacity="0.06"/>
    <circle cx="50" cy="45" r="16" fill="#34D399"/>
    <text x="40" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white">%</text>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white">Pasarelas colombianas</text>
    <text x="85" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="white" opacity="0.4">Wompi, ePayco, Mercado Pago nativo</text>
  </g>

  <g transform="translate(100, 560)">
    <rect x="0" y="0" width="880" height="90" rx="16" fill="white" opacity="0.06"/>
    <circle cx="50" cy="45" r="16" fill="#34D399"/>
    <text x="43" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="white">!</text>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white">Tuyo, no alquilado</text>
    <text x="85" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="white" opacity="0.4">Tu tienda es tuya, te la llevas cuando quieras</text>
  </g>

  <g transform="translate(100, 670)">
    <rect x="0" y="0" width="880" height="90" rx="16" fill="white" opacity="0.06"/>
    <circle cx="50" cy="45" r="16" fill="#34D399"/>
    <text x="44" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="white">+</text>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white">100% personalizable</text>
    <text x="85" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="white" opacity="0.4">Sin límites de diseño ni funcionalidades</text>
  </g>

  <!-- Bottom text -->
  <text x="540" y="860" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="white" opacity="0.6">Nosotros nos encargamos de lo técnico</text>
  <text x="540" y="905" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#818CF8">Tú te enfocas en vender</text>

  <!-- Bottom brand -->
  <text x="540" y="1040" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.3" letter-spacing="6">E-COMMERCEHOST</text>
</svg>
