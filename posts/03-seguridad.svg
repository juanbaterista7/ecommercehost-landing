<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg3)"/>

  <!-- Shield icon -->
  <g transform="translate(390, 80)">
    <path d="M150,0 L300,60 L300,180 Q300,320 150,380 Q0,320 0,180 L0,60 Z" fill="none" stroke="#34D399" stroke-width="6" opacity="0.3"/>
    <path d="M150,30 L270,80 L270,180 Q270,300 150,350 Q30,300 30,180 L30,80 Z" fill="#34D399" opacity="0.1"/>
    <!-- Checkmark -->
    <polyline points="90,190 130,230 210,150" fill="none" stroke="#34D399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main text -->
  <text x="540" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="white">TU TIENDA</text>
  <text x="540" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="#34D399">PROTEGIDA</text>

  <!-- Feature list -->
  <g transform="translate(200, 730)">
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="25" y="8" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="white" opacity="0.7">SSL gratuito incluido</text>
  </g>
  <g transform="translate(200, 790)">
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="25" y="8" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="white" opacity="0.7">Cloudflare WAF</text>
  </g>
  <g transform="translate(200, 850)">
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="25" y="8" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="white" opacity="0.7">Backups automáticos</text>
  </g>
  <g transform="translate(200, 910)">
    <circle cx="0" cy="0" r="8" fill="#34D399"/>
    <text x="25" y="8" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="white" opacity="0.7">Firewall configurado</text>
  </g>

  <!-- Bottom brand -->
  <text x="540" y="1020" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.3" letter-spacing="6">E-COMMERCEHOST</text>
</svg>
