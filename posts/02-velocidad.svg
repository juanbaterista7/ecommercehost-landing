<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg2)"/>

  <!-- Speed lines -->
  <rect x="0" y="300" width="400" height="3" fill="#818CF8" opacity="0.3"/>
  <rect x="0" y="350" width="300" height="3" fill="#818CF8" opacity="0.2"/>
  <rect x="0" y="700" width="350" height="3" fill="#818CF8" opacity="0.25"/>
  <rect x="0" y="750" width="250" height="3" fill="#818CF8" opacity="0.15"/>

  <!-- Lightning icon -->
  <g transform="translate(440, 120)">
    <polygon points="100,0 30,120 90,120 60,220 170,80 110,80 140,0" fill="#FBBF24" opacity="0.9"/>
  </g>

  <!-- Main text -->
  <text x="540" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="white" opacity="0.5">TU TIENDA CARGA EN</text>

  <!-- Big number -->
  <text x="540" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="900" fill="white">&lt;1s</text>

  <!-- Subtext -->
  <text x="540" y="700" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="white" opacity="0.5">segundo de carga</text>

  <!-- Tech stack pills -->
  <rect x="120" y="790" width="180" height="50" rx="25" fill="white" opacity="0.1"/>
  <text x="210" y="822" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#818CF8">Nginx</text>

  <rect x="330" y="790" width="180" height="50" rx="25" fill="white" opacity="0.1"/>
  <text x="420" y="822" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#818CF8">Redis</text>

  <rect x="540" y="790" width="180" height="50" rx="25" fill="white" opacity="0.1"/>
  <text x="630" y="822" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#818CF8">OPcache</text>

  <rect x="750" y="790" width="210" height="50" rx="25" fill="white" opacity="0.1"/>
  <text x="855" y="822" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#818CF8">Cloudflare</text>

  <!-- Bottom brand -->
  <text x="540" y="1020" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.3" letter-spacing="6">E-COMMERCEHOST</text>
</svg>
