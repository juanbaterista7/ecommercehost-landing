<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Shopping bag icon -->
  <g transform="translate(256, 195)" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag body -->
    <path d="M-70,10 L-58,-45 Q-55,-55 -45,-55 L45,-55 Q55,-55 58,-45 L70,10 L75,75 Q76,85 66,85 L-66,85 Q-76,85 -75,75 Z" fill="rgba(255,255,255,0.15)" stroke="white"/>
    <!-- Bag handle -->
    <path d="M-30,-55 L-30,-75 Q-30,-100 0,-100 Q30,-100 30,-75 L30,-55" fill="none"/>
  </g>

  <!-- "eH" text -->
  <text x="256" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    <tspan fill="rgba(255,255,255,0.85)">e</tspan><tspan fill="white">H</tspan>
  </text>
</svg>
